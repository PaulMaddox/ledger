# Continuous integration for the PAM ledger.
#
# Runs on every pull request and on every push to main. Both jobs are required
# status checks on main (see the repository ruleset), so a pull request cannot
# be merged until they pass.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only token: CI never needs to write to the repository.
permissions:
  contents: read

# A new push to the same pull request cancels the run that is now out of date.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Kotlin tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # The repository has no Gradle wrapper, so pin the Gradle version here.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Run the test suite
        run: gradle test --no-daemon

      # Concurrency bugs are often intermittent, so run the whole suite a second
      # time from scratch. A test that passes once and fails once is a real bug.
      - name: Run the test suite again (catches intermittent races)
        run: gradle test --no-daemon --rerun-tasks

      # Guard against a silent "pass" with nothing tested (for example a JUnit
      # platform misconfiguration). Counts the JUnit XML results and fails if no
      # tests ran or any failed; the count is shown as an annotation on the run.
      - name: Confirm tests actually ran
        run: |
          python3 - <<'PY'
          import glob, sys, xml.etree.ElementTree as ET
          total = failed = skipped = 0
          for f in glob.glob("build/test-results/test/*.xml"):
              s = ET.parse(f).getroot()
              total += int(s.get("tests", 0))
              failed += int(s.get("failures", 0)) + int(s.get("errors", 0))
              skipped += int(s.get("skipped", 0))
          print(f"::notice title=Test results::{total} tests ran, {failed} failed, {skipped} skipped")
          if total == 0 or failed or skipped:
              print("::error title=Test results::expected every test to run and pass")
              sys.exit(1)
          PY

      - name: Build and run the demo, which ends with an independent audit
        run: gradle run --no-daemon

      # README.md documents running the demo as a standalone program; prove it works.
      - name: Run the demo from the installed launcher, as documented in README.md
        run: |
          gradle installDist --no-daemon
          build/install/pam-ledger/bin/pam-ledger

      - name: Keep the test reports when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/
          retention-days: 14

  guide:
    name: Guide is up to date and consistent
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The guide embeds the real Kotlin sources and tests. Rebuild it and fail if
      # the committed docs/index.html differs, i.e. someone changed code or the
      # template without rebuilding.
      - name: Rebuild the guide
        run: python3 scripts/build-readme.py

      - name: Fail if the committed guide is stale
        run: |
          if ! git diff --exit-code --stat -- docs/index.html; then
            echo "::error file=docs/index.html::docs/index.html is out of date. Run 'python3 scripts/build-readme.py' and commit the result."
            exit 1
          fi

      # Fails if a debugger step points at a Kotlin line that no longer exists,
      # a cloud component is missing its rationale, or a test link is broken.
      - name: Check the guide
        run: node scripts/check-guide.mjs
